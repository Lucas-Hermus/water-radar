name: probe archief
on:
  push:
    paths: ['tools/probe-archief.mjs', '.github/workflows/probe-archief.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node tools/probe-archief.mjs
