name: probe cors
on:
  push:
    paths: ['tools/probe-cors.mjs', '.github/workflows/probe-cors.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node tools/probe-cors.mjs
